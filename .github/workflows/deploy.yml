name: Cerberus Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, gaia]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Secrets
        env:
          # Secrets needed for generation
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          STORAGE_ENCRYPTION_KEY: ${{ secrets.STORAGE_ENCRYPTION_KEY }}
          LLDAP_JWT_SECRET: ${{ secrets.LLDAP_JWT_SECRET }}
          LLDAP_KEY_SEED: ${{ secrets.LLDAP_KEY_SEED }}
          LLDAP_LDAP_USER_PASS: ${{ secrets.LLDAP_LDAP_USER_PASS }}
          VW_ADMIN_TOKEN: ${{ secrets.VW_ADMIN_TOKEN }}
          OIDC_PRIVATE_KEY: ${{ secrets.OIDC_PRIVATE_KEY }}
          OIDC_PORTAINER_CLIENT_SECRET: ${{ secrets.OIDC_PORTAINER_CLIENT_SECRET }}
          OIDC_GRAFANA_CLIENT_SECRET: ${{ secrets.OIDC_GRAFANA_CLIENT_SECRET }}
          OIDC_EIDOS_CLIENT_SECRET: ${{ secrets.OIDC_EIDOS_CLIENT_SECRET }}
          AUTHENTIK_SECRET_KEY: ${{ secrets.AUTHENTIK_SECRET_KEY }}
          AUTHENTIK_POSTGRES_PASSWORD: ${{ secrets.AUTHENTIK_POSTGRES_PASSWORD }}
          AUTHENTIK_BOOTSTRAP_PASSWORD: ${{ secrets.AUTHENTIK_BOOTSTRAP_PASSWORD }}
          AUTHENTIK_LDAP_TOKEN: ${{ secrets.AUTHENTIK_LDAP_TOKEN }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/ensure_secret.sh -o /tmp/ensure_secret.sh
          chmod +x /tmp/ensure_secret.sh
          
          # Authelia Secrets
          echo "JWT_SECRET_NAME=$(echo "$JWT_SECRET" | /tmp/ensure_secret.sh cerberus_jwt_secret)" >> $GITHUB_ENV
          echo "SESSION_SECRET_NAME=$(echo "$SESSION_SECRET" | /tmp/ensure_secret.sh cerberus_session_secret)" >> $GITHUB_ENV
          echo "STORAGE_ENCRYPTION_KEY_NAME=$(echo "$STORAGE_ENCRYPTION_KEY" | /tmp/ensure_secret.sh cerberus_storage_encryption_key)" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD_NAME=$(echo "$POSTGRES_PASSWORD" | /tmp/ensure_secret.sh cerberus_postgres_password)" >> $GITHUB_ENV
          
          # LLDAP Secrets
          echo "LLDAP_JWT_SECRET_NAME=$(echo "$LLDAP_JWT_SECRET" | /tmp/ensure_secret.sh cerberus_lldap_jwt_secret)" >> $GITHUB_ENV
          echo "LLDAP_KEY_SEED_NAME=$(echo "$LLDAP_KEY_SEED" | /tmp/ensure_secret.sh cerberus_lldap_key_seed)" >> $GITHUB_ENV
          echo "LLDAP_LDAP_USER_PASS_NAME=$(echo "$LLDAP_LDAP_USER_PASS" | /tmp/ensure_secret.sh cerberus_lldap_user_pass)" >> $GITHUB_ENV
          
          # Vaultwarden Secrets
          echo "VW_ADMIN_TOKEN_NAME=$(echo "$VW_ADMIN_TOKEN" | /tmp/ensure_secret.sh cerberus_vw_admin_token)" >> $GITHUB_ENV

          # OIDC Secrets
          echo "OIDC_PRIVATE_KEY_NAME=$(echo "$OIDC_PRIVATE_KEY" | /tmp/ensure_secret.sh cerberus_oidc_key)" >> $GITHUB_ENV
          echo "OIDC_PORTAINER_CLIENT_SECRET_NAME=$(echo "$OIDC_PORTAINER_CLIENT_SECRET" | /tmp/ensure_secret.sh cerberus_portainer_client_secret)" >> $GITHUB_ENV
          echo "OIDC_GRAFANA_CLIENT_SECRET_NAME=$(echo "$OIDC_GRAFANA_CLIENT_SECRET" | /tmp/ensure_secret.sh cerberus_grafana_client_secret)" >> $GITHUB_ENV
          echo "OIDC_EIDOS_CLIENT_SECRET_NAME=$(echo "$OIDC_EIDOS_CLIENT_SECRET" | /tmp/ensure_secret.sh cerberus_eidos_client_secret)" >> $GITHUB_ENV

          # Authentik Secrets
          echo "AUTHENTIK_SECRET_KEY_NAME=$(echo "$AUTHENTIK_SECRET_KEY" | /tmp/ensure_secret.sh cerberus_authentik_secret_key)" >> $GITHUB_ENV
          echo "AUTHENTIK_POSTGRES_PASSWORD_NAME=$(echo "$AUTHENTIK_POSTGRES_PASSWORD" | /tmp/ensure_secret.sh cerberus_authentik_postgres_password)" >> $GITHUB_ENV
          echo "AUTHENTIK_BOOTSTRAP_PASSWORD_NAME=$(echo "$AUTHENTIK_BOOTSTRAP_PASSWORD" | /tmp/ensure_secret.sh cerberus_authentik_bootstrap_password)" >> $GITHUB_ENV
          echo "AUTHENTIK_LDAP_TOKEN_NAME=$(echo "${AUTHENTIK_LDAP_TOKEN:-placeholder_token}" | /tmp/ensure_secret.sh cerberus_authentik_ldap_token)" >> $GITHUB_ENV

      - name: Deploy Stack
        env:
          # Domain Variables
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          LLDAP_LDAP_BASE_DN: ${{ vars.LLDAP_LDAP_BASE_DN }}
          LLDAP_LDAP_USER_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/deploy.sh -o /tmp/deploy.sh
          chmod +x /tmp/deploy.sh
          /tmp/deploy.sh "cerberus" docker-compose.yml